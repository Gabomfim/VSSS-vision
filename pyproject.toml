[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-soccer-vision"
version = "0.1.0"
description = "Overhead-camera orange ball tracker for robot soccer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
robot-soccer-track = "robot_soccer_vision.app:main"
robot-soccer-track-adaptive = "robot_soccer_vision.adaptive_app:main"
robot-soccer-track-fast = "robot_soccer_vision.fast_app:main"
robot-soccer-tune = "robot_soccer_vision.tune_app:main"
robot-soccer-label = "robot_soccer_vision.label_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
